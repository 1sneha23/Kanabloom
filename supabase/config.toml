# Supabase CLI config for local development (`supabase start`). Hosted projects use dashboard settings.
project_id = "kanabloom"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true      # email verification required before login
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
email_sent = 10

[storage]
file_size_limit = "500MiB"

[functions.score-writing]
verify_jwt = true
[functions.admin-users]
verify_jwt = true
[functions.generate-video]
verify_jwt = true
[functions.video-webhook]
verify_jwt = false               # authenticated by VIDEO_WEBHOOK_SECRET instead
